name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  integration-test-linux:
    name: Agentic UI tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      # The uncached integration closure has exhausted the hosted runner.
      - run: nix run .#ui-tests --max-jobs 2 --cores 2

  integration-test-macos:
    name: Agentic UI tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      - run: nix run .#ui-tests

  qml-tests-linux:
    name: QML tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      - run: nix run .#qml-tests

  qml-tests-macos:
    name: QML tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      - run: nix run .#qml-tests

  unit-tests-linux:
    name: Unit tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      - run: nix build -L ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).unit-tests"

  unit-tests-macos:
    name: Unit tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      - run: nix build -L ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).unit-tests"

  # Reads sources only: once is enough.
  shared-installer-words:
    name: Shared installer words (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      - run: nix build -L ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).shared-installer-words"
